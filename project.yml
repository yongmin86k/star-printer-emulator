name: StarEmu
options:
  deploymentTarget:
    macOS: "14.0"
packages:
  StarEmu:
    path: .
targets:
  StarEmu:
    type: application
    platform: macOS
    sources: [App]
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - package: StarEmu
        product: StarEmuCore
    settings:
      base:
        PRODUCT_NAME: "StarPrinter Emulator"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/StarEmu.entitlements
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Receives print jobs from POS devices on your local network."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
